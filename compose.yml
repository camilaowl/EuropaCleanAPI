services:
  api:
    build: .
    volumes:
      - .:/rails
    depends_on: [db]
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/europa_clean
      TEST_DATABASE_URL: postgres://postgres:postgres@db:5432/europa_clean_test
    healthcheck: 
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 5
    env_file:
      - .env

  db: 
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: europa_clean
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: